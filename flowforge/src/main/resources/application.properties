spring.application.name=flowforge
server.port=8082

# Health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Development database
spring.datasource.url=jdbc:mysql://localhost:3306/flowforge?connectionTimeZone=UTC
spring.datasource.username=flowforge_app
spring.datasource.password=${FLOWFORGE_DB_PASSWORD}

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway owns schema creation and changes
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.sql.init.mode=never

# Retry policy
flowforge.retry.max-attempts=3
flowforge.retry.initial-delay-ms=100
flowforge.retry.max-delay-ms=1000